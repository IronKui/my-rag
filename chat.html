<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI知识库问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .header {
            padding: 16px 20px;
            background: #4a90d9;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #4a90d9;
            color: #fff;
            border-top-right-radius: 2px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #e9e9eb;
            color: #333;
            border-top-left-radius: 2px;
        }
        .message.loading {
            color: #999;
            font-style: italic;
        }
        .message.error {
            align-self: center;
            background: #fdecea;
            color: #d32f2f;
        }
        .input-area {
            border-top: 1px solid #eee;
            padding: 12px 16px;
        }
        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #555;
        }
        .file-info .file-name {
            background: #f0f4ff;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .file-info .cancel-btn {
            cursor: pointer;
            color: #d32f2f;
            border: none;
            background: none;
            font-size: 14px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .input-row input[type="text"]:focus {
            border-color: #4a90d9;
        }
        .upload-btn, .send-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .upload-btn {
            background: #f0f4ff;
            color: #4a90d9;
        }
        .send-btn {
            background: #4a90d9;
            color: #fff;
        }
        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">AI 知识库问答</div>

        <!-- 聊天记录区 -->
        <div class="messages" id="messages"></div>

        <!-- 输入区 -->
        <div class="input-area">
            <div class="file-info" id="fileInfo" style="display:none;">
                <span class="file-name" id="fileName"></span>
                <button class="cancel-btn" onclick="cancelFile()">✕ 取消</button>
            </div>
            <div class="input-row">
                <input type="file" id="fileInput" style="display:none;" accept=".pdf,.docx,.md,.txt">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="text" id="questionInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // ====== 配置 ======
        const SESSION_ID = "test-1";        // 开发阶段固定
        const BASE_URL = "http://localhost:8000";   // 后端地址

        let selectedFile = null;   // 前端暂存选中的文件（未发送前只是预览）

        // ====== 工具函数 ======
        function addMessage(role, content) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = content;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;   // 滚动到底部
        }

        function showLoading() {
            const div = document.createElement('div');
            div.className = 'message loading';
            div.id = 'loadingMsg';
            div.textContent = '思考中...';
            document.getElementById('messages').appendChild(div);
        }

        function removeLoading() {
            const el = document.getElementById('loadingMsg');
            if (el) el.remove();
        }

        // ====== 文件选择（仅前端预览，不发送） ======
        document.getElementById('fileInput').addEventListener('change', function() {
            selectedFile = this.files[0];
            if (selectedFile) {
                document.getElementById('fileName').textContent = selectedFile.name;
                document.getElementById('fileInfo').style.display = 'flex';
            }
        });

        function cancelFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('fileInfo').style.display = 'none';
        }

        // ====== 上传文件 ======
        async function uploadFile() {
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('session_id', SESSION_ID);

            const res = await fetch(BASE_URL + '/api/upload', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            return data;
        }

        // ====== 发送消息 ======
        async function sendMessage() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question && !selectedFile) return;

            // 1. 如果有选中的文件，先上传
            if (selectedFile) {
                const fileName = selectedFile.name;
                addMessage('user', `[上传文件] ${fileName}`);
                showLoading();
                try {
                    const upRes = await uploadFile();
                    removeLoading();
                    if (upRes.code === 0) {
                        addMessage('assistant', `✅ ${upRes.message}（${upRes.data.chunk_count} 个文本块）`);
                    } else {
                        addMessage('error', `上传失败：${upRes.message}`);
                        return;
                    }
                } catch (e) {
                    removeLoading();
                    addMessage('error', '上传出错：' + e.message);
                    return;
                }
                cancelFile();
            }

            // 2. 发送问题（如果有的话）
            if (question) {
                addMessage('user', question);
                input.value = '';
                showLoading();
                try {
                    const res = await fetch(BASE_URL + '/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: question, session_id: SESSION_ID })
                    });
                    const data = await res.json();
                    removeLoading();
                    if (data.code === 0) {
                        addMessage('assistant', data.data.answer);
                    } else {
                        addMessage('error', '回复失败：' + data.message);
                    }
                } catch (e) {
                    removeLoading();
                    addMessage('error', '请求出错：' + e.message);
                }
            }
        }
    </script>
</body>
</html>
